[package]
name = "worker"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "os_widget_worker"
crate-type = ["cdylib"]

[dependencies]
envelope = { path = "../envelope" }
worker = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js"] }
