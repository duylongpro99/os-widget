name: OSWidget
options:
  bundleIdPrefix: local.oswidget
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    # The only place the Team ID is set. The App Group derives from it:
    # entitlements use $(TeamIdentifierPrefix)os-widget, Swift reads APP_GROUP_ID via Info.plist.
    DEVELOPMENT_TEAM: 22LZWPB3XL
    APP_GROUP_ID: $(DEVELOPMENT_TEAM).os-widget
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
packages:
  OSWidgetKit:
    path: OSWidgetKit
targets:
  OSWidget:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: OSWidgetKit
      - target: OSWidgetWidget
        embed: true
        codeSign: true
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)os-widget
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: OS Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.oswidget.app
  OSWidgetWidget:
    type: app-extension
    platform: macOS
    sources: [Widget]
    dependencies:
      - package: OSWidgetKit
    # No network entitlement: only the app talks to the server; the widget reads the shared store and
    # writes actions to the inbox in the App Group container.
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)os-widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: OS Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.oswidget.app.widget
